name: Deploy Help to Firebase Hosting

on:
  push:
    branches: [ main ]
    paths:
      - 'help/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set env from repo
        run: |
          echo "PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}" >> "$GITHUB_ENV"
          if [ -n "${{ secrets.HELP_FIREBASE_SITE }}" ]; then
            echo "HELP_FIREBASE_SITE_ID=${{ secrets.HELP_FIREBASE_SITE }}" >> "$GITHUB_ENV"
          else
            echo "HELP_FIREBASE_SITE_ID=${{ secrets.GCP_PROJECT_ID }}-help" >> "$GITHUB_ENV"
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./help
        run: npm ci

      - name: Build help site
        working-directory: ./help
        run: npm run build

      - name: Deploy to Firebase Hosting (uses GCP SA credentials)
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          cd help
          npx firebase-tools target:apply hosting help "$HELP_FIREBASE_SITE_ID" --project "$PROJECT_ID"
          npx firebase-tools deploy --only hosting:help --project "$PROJECT_ID"

