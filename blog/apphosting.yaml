scripts:
  runCommand: HOST=0.0.0.0 node blog/dist/server/entry.mjs

outputFiles:
  serverApp:
    include:
      - dist

env:
  - variable: SANITY_PROJECT_ID
    value: r499aase
    availability:
      - BUILD
      - RUNTIME

  - variable: SANITY_DATASET
    value: production
    availability:
      - BUILD
      - RUNTIME

  - variable: SANITY_API_VERSION
    value: 2025-05-08
    availability:
      - BUILD
      - RUNTIME